[package]
name = "focus_embed"
version.workspace = true
description = "Phase 0: an embeddable wasm-bindgen + wgpu Vello renderer for Penpot focus mode."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
js-sys = { workspace = true }
log = { workspace = true }
vello_common = { workspace = true }
vello_hybrid = { workspace = true }
vello_example_scenes = { workspace = true }
# The backend-neutral model, shared with render-wasm. This is the crate render-wasm's converter
# projects Shapes into; here we render it with Vello — the second half of the end-to-end pipeline.
render-core = { path = "../../../../../render-wasm/render-core" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "Performance",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGl2RenderingContext",
    "KeyboardEvent",
] }
wgpu = { workspace = true, default-features = true, features = ["webgl"] }
